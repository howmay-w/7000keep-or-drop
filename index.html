<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanzi Keep or Drop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-main">
      <section class="panel upload-panel" id="uploadPanel">
        <div class="actions-row">
          <button id="startBtn" class="primary" disabled>Start</button>
          <button id="exportBtn" class="secondary" disabled>Export</button>
          <button id="clearBtn" class="danger">Clear</button>
          <button id="menuBtn" class="ghost" title="More">Search</button>
        </div>
        <div class="progress-row">
          <div class="stat"><span id="countTotal">0</span> Total</div>
          <div class="stat keep">Keep: <span id="countKeep">0</span></div>
          <div class="stat drop">Drop: <span id="countDrop">0</span></div>
          <div class="stat skip">Skip: <span id="countSkip">0</span></div>
        </div>
        <div class="progress-bar" aria-hidden="true">
          <div id="progressFill"></div>
        </div>
        <div id="moreMenu" class="more-menu hidden" aria-hidden="true">
          <div class="menu-row">
            <input
              id="searchChar"
              type="text"
              inputmode="search"
              placeholder="Enter a character"
            />
            <button id="searchGo" class="secondary">Go to character</button>
          </div>
          <div class="menu-row">
            <button id="jumpUnreviewed" class="primary">Jump to unreviewed</button>
          </div>
        </div>
      </section>

      <section class="panel review-panel hidden" id="reviewPanel">
        <div class="card">
          <div class="char-area">
            <div class="seq-row">
              <div id="seqDisplay" class="unicode"></div>
              <a href="#" id="copyCharBtn" class="copy-link">Copy</a>
            </div>
            <div id="charDisplay" class="hanzi">—</div>
            <div id="unicodeDisplay" class="unicode"></div>
          </div>
          <div class="meta-area">
            <div class="meta-grid">
              <div class="meta-item">
                <div class="meta-label">Set</div>
                <div class="meta-value" id="fieldSet">—</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">Category</div>
                <div class="meta-value" id="fieldCategory">—</div>
              </div>
              <div class="meta-item span-2">
                <div class="meta-label">Notes</div>
                <div class="meta-value pre-wrap" id="fieldNote">—</div>
              </div>
              <div class="meta-item span-2">
                <div class="meta-label">Reviewer note</div>
                <div class="meta-value">
                  <textarea
                    id="userNote"
                    rows="2"
                    placeholder="Why keep or drop? 🥹"
                  ></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-controls">
          <div class="controls">
            <button id="btnDrop" class="danger" title="Drop (← or A)">
              Drop ← / A
            </button>
            <button id="btnSkip" class="secondary" title="Skip (↑ or W)">
              Skip ↑ / W
            </button>
            <button id="btnKeep" class="success" title="Keep (→ or D)">
              Keep → / D
            </button>
          </div>
          <div class="secondary-controls">
            <button id="btnUndo" class="ghost" title="Undo (Backspace or Z)">
              Undo ⌫ / Z
            </button>
            <div class="index-indicator">
              <span id="indexNow">0</span> / <span id="indexTotal">0</span>
            </div>
          </div>
        </div>
        <div id="finishBanner" class="finish hidden">
          🎉 All done! Great job! Please export your results — remember to add your name to the filename 🙏
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="hint"></div>
    </footer>

    <script src="./app.js"></script>
    <noscript>This tool requires JavaScript.</noscript>
  </body>
  <style></style>
</html>
